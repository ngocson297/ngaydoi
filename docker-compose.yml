services:
  postgres:
    image: postgres:17-alpine
    container_name: ngaydoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ngaydoi}
      POSTGRES_USER: ${POSTGRES_USER:-ngaydoi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ngaydoi_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ngaydoi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ngaydoi} -d ${POSTGRES_DB:-ngaydoi}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ngaydoi_postgres_data:
